name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Only publish the public site: no rules, skills, previews or ZIP.
      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html blog.html _site/
          cp -R assets _site/assets
          test -s _site/index.html
          test -s _site/blog.html
          test -d _site/assets/css
          test -d _site/assets/js
          test -d _site/assets/images
          echo "Artifact contents:"
          find _site -type f | sed 's/^/  /'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
