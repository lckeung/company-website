name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Stop the branch-based Jekyll build from publishing the whole repo.
      - name: Set Pages source to GitHub Actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"build_type":"workflow"}')
          echo "Pages API HTTP $code"
          cat /tmp/pages.json
          test "$code" = "204" -o "$code" = "200"

      # Only publish the public site: no rules, skills, previews or ZIP.
      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html blog.html _site/
          cp -R assets _site/assets
          test -s _site/index.html
          test -s _site/blog.html
          test -d _site/assets/css
          test -d _site/assets/js
          test -d _site/assets/images
          # Never publish archives, screenshots or internal configuration.
          if find _site \( -name '*.zip' -o -name 'preview-*.png' -o -name '.trae' -o -name '.company-rules' \) | grep -q .; then
            echo "Forbidden file or folder found in artifact" >&2
            find _site | sed 's/^/  /' >&2
            exit 1
          fi
          echo "Artifact contents:"
          find _site -type f | sed 's/^/  /'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
